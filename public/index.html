<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxly</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #eef0f7; --app: #ffffff; --border: #ebebf0;
      --card-a: #e8eaf6; --card-b: #e8f0fb; --card-c: #e6f4f1;
      --accent: #4f46e5; --accent-light: #eef0ff;
      --green: #10b981; --red: #ef4444;
      --text: #1a1a2e; --muted: #8b8fa8; --input-bg: #f5f5fa;
      --shadow: 0 12px 48px rgba(79,70,229,0.08), 0 2px 8px rgba(0,0,0,0.04);
    }
    body {
      background: var(--bg); font-family: 'EB Garamond', serif;
      height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
    }
    .app {
      background: var(--app); border-radius: 32px; box-shadow: var(--shadow);
      width: 100%; max-width: 800px; height: 92vh;
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--border);
    }
    .header {
      padding: 24px 32px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 42px; height: 42px; background: var(--accent);
      border-radius: 14px; display: flex; align-items: center;
      justify-content: center; font-size: 20px;
      box-shadow: 0 4px 14px rgba(79,70,229,0.3);
    }
    .logo-name { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -0.6px; }
    .logo-name span { color: var(--accent); }
    .logo-sub {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 1px;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .lang-wrap { position: relative; }
    select {
      appearance: none; background: var(--input-bg); border: 1px solid var(--border);
      color: var(--text); font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 500; padding: 9px 36px 9px 14px;
      border-radius: 12px; cursor: pointer; letter-spacing: 0.5px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .lang-arrow {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 10px; pointer-events: none;
    }
    .status-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: 20px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
      transition: all 0.4s ease;
      background: #fef2f2; color: var(--red);
    }
    .status-pill.online { background: #ecfdf5; color: var(--green); }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--red); transition: background 0.4s ease;
      animation: blink 2.5s ease-in-out infinite;
    }
    .status-pill.online .status-dot { background: var(--green); }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
    .stats { display: flex; gap: 14px; padding: 20px 32px; border-bottom: 1px solid var(--border); }
    .stat-card {
      flex: 1; padding: 18px 20px; border-radius: 20px;
      display: flex; align-items: center; justify-content: space-between;
      transition: transform 0.2s; cursor: default;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card.a { background: var(--card-a); }
    .stat-card.b { background: var(--card-b); }
    .stat-card.c { background: var(--card-c); }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -1.5px; line-height: 1; }
    .stat-value.small { font-size: 16px; letter-spacing: -0.5px; }
    .stat-badge {
      width: 34px; height: 34px; background: rgba(255,255,255,0.65);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 16px; backdrop-filter: blur(4px);
    }
    #chatbox {
      flex: 1; overflow-y: auto; padding: 24px 32px;
      display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
    }
    #chatbox::-webkit-scrollbar { width: 4px; }
    #chatbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .empty-state {
      margin: auto; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .venus {
      width: 80px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f8c8e8, #c084a8 50%, #7c3a6e);
      box-shadow: 0 0 0 8px rgba(192,132,168,0.15), 0 0 0 20px rgba(192,132,168,0.07), 0 8px 32px rgba(192,132,168,0.3);
      position: relative; animation: float 4s ease-in-out infinite;
    }
    .venus::after {
      content: '♀'; position: absolute; bottom: -28px; left: 50%;
      transform: translateX(-50%); font-size: 18px; color: #c084a8; font-weight: 300;
    }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    .empty-title { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; margin-top: 20px; }
    .empty-sub { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 240px; }
    .msg {
      display: flex; gap: 10px; max-width: 78%;
      animation: pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop { from{opacity:0;transform:translateY(12px) scale(0.96);} to{opacity:1;transform:translateY(0) scale(1);} }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .avatar {
      width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; margin-top: 2px; font-weight: 700;
    }
    .msg.user .avatar { background: var(--accent-light); color: var(--accent); }
    .msg.bot .avatar { background: var(--card-c); }
    .bubble { padding: 13px 17px; border-radius: 20px; font-size: 14px; line-height: 1.65; color: var(--text); font-weight: 400; }
    .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; box-shadow: 0 4px 16px rgba(79,70,229,0.25); }
    .msg.bot .bubble { background: var(--input-bg); border-bottom-left-radius: 5px; border: 1px solid var(--border); }
    .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 15px 20px; }
    .typing .bubble span { width: 7px; height: 7px; border-radius: 50%; animation: bounce 1.3s ease-in-out infinite; }
    .typing .bubble span:nth-child(1) { background: var(--card-a); animation-delay: 0s; }
    .typing .bubble span:nth-child(2) { background: var(--accent); animation-delay: 0.18s; }
    .typing .bubble span:nth-child(3) { background: var(--card-c); animation-delay: 0.36s; }
    @keyframes bounce { 0%,100%{transform:translateY(0);opacity:0.5;} 50%{transform:translateY(-6px);opacity:1;} }
    .input-area { padding: 18px 32px 26px; border-top: 1px solid var(--border); }
    .input-row {
      display: flex; gap: 10px; align-items: center;
      background: var(--input-bg); border: 1.5px solid var(--border);
      border-radius: 18px; padding: 8px 8px 8px 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,0.08); }
    input[type="text"] {
      flex: 1; background: transparent; border: none;
      color: var(--text); font-family: 'EB Garamond', serif;
      font-size: 14px; outline: none; font-weight: 400;
    }
    input::placeholder { color: var(--muted); }
    button {
      background: var(--accent); border: none; color: #fff;
      font-family: 'EB Garamond', serif; font-weight: 700;
      font-size: 13px; padding: 11px 22px; border-radius: 13px;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 2px 10px rgba(79,70,229,0.3); letter-spacing: 0.2px;
    }
    button:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 18px rgba(79,70,229,0.4); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .hint { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); text-align: center; margin-top: 10px; letter-spacing: 1px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">🗣️</div>
        <div class="logo-text">
          <div class="logo-name">Voxly<span>.</span></div>
          <div class="logo-sub">multilingual ai</div>
        </div>
      </div>
      <div class="header-right">
        <div class="lang-wrap">
          <select id="language">
            <option>English</option><option>Hindi</option><option>Bengali</option>
            <option>Spanish</option><option>French</option><option>Japanese</option><option>Arabic</option>
          </select>
          <span class="lang-arrow">▾</span>
        </div>
        <div class="status-pill" id="statusPill">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Connecting</span>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card a">
        <div><div class="stat-label">Languages</div><div class="stat-value">7</div></div>
        <div class="stat-badge">🌐</div>
      </div>
      <div class="stat-card b">
        <div><div class="stat-label">Messages</div><div class="stat-value" id="msgCount">0</div></div>
        <div class="stat-badge">💬</div>
      </div>
      <div class="stat-card c">
        <div><div class="stat-label">Built by</div><div class="stat-value small">qezzed</div></div>
        <div class="stat-badge">✦</div>
      </div>
    </div>
    <div id="chatbox">
      <div class="empty-state" id="emptyState">
        <div class="venus"></div>
        <div class="empty-title">Ready to connect?</div>
        <div class="empty-sub">Type your first message in any language and Voxly will respond.</div>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="userInput" placeholder="Type anything, in any language..." autocomplete="off" />
        <button onclick="sendMessage()" id="sendBtn">Send ↑</button>
      </div>
      <div class="hint">↵ enter to send &nbsp;•&nbsp; voxly by qezzed</div>
    </div>
  </div>

  <script>
   const chatbox = document.getElementById('chatbox');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const statusPill = document.getElementById('statusPill');
const statusText = document.getElementById('statusText');
let msgCount = 0;
let chatHistory = [];
let isOnline = false;
let isListening = false;
const synth = window.speechSynthesis;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = SpeechRecognition ? new SpeechRecognition() : null;

// Add mic button to input area
const inputRow = document.querySelector('.input-row');
const micBtn = document.createElement('button');
micBtn.id = 'micBtn';
micBtn.textContent = '🎤';
micBtn.style.cssText = 'background:#f0f0ff;color:#4f46e5;padding:11px 14px;font-size:16px;margin-right:4px;';
micBtn.title = 'Click to speak';
inputRow.insertBefore(micBtn, document.getElementById('sendBtn'));

if (recognition) {
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    input.value = e.results[0][0].transcript;
    micBtn.textContent = '🎤';
    isListening = false;
    sendMessage();
  };
  recognition.onend = () => {
    micBtn.textContent = '🎤';
    isListening = false;
  };
}

micBtn.addEventListener('click', () => {
  if (!recognition) return alert('Voice not supported in this browser. Use Chrome!');
  if (isListening) {
    recognition.stop();
    micBtn.textContent = '🎤';
    isListening = false;
  } else {
    recognition.start();
    micBtn.textContent = '🔴';
    isListening = true;
  }
});

  function speakText(text, lang) {
    const voices = synth.getVoices();
const hasVoice = voices.some(v => v.lang === lang);
if (!hasVoice) return;
    if (!synth) return;
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang || 'en-US';
  utt.pitch = 0.95;
  utt.rate = 0.9;
  synth.speak(utt);
}


fetch('/health').then(r => r.json()).catch(() => setOffline());

function setOnline() {
  if (isOnline) return;
  isOnline = true;
  statusPill.classList.add('online');
  statusText.textContent = 'Online';
}

function setOffline() {
  isOnline = false;
  statusPill.classList.remove('online');
  statusText.textContent = 'Offline';
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

function addMessage(text, role) {
  document.getElementById('emptyState')?.remove();
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '✦' : '🗣️';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatbox.appendChild(msg);
  chatbox.scrollTop = chatbox.scrollHeight;
}

function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg bot typing'; msg.id = 'typing';
  const avatar = document.createElement('div');
  avatar.className = 'avatar'; avatar.textContent = '🗣️';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  msg.appendChild(avatar); msg.appendChild(bubble);
  chatbox.appendChild(msg);
  chatbox.scrollTop = chatbox.scrollHeight;
}

async function sendMessage() {
  const message = input.value.trim();
  const language = document.getElementById('language').value;
  if (!message) return;
  input.value = '';
  sendBtn.disabled = true;
  addMessage(message, 'user');
  addTyping();
  document.getElementById('msgCount').textContent = ++msgCount;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, language, history: chatHistory })
    });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    if (data.reply) {
      addMessage(data.reply, 'bot');
      chatHistory.push({ role: 'user', text: message });
      chatHistory.push({ role: 'model', text: data.reply });
      if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
      setOnline();
      speakText(data.reply, data.lang);
    } else {
      addMessage(data.error || 'Something went wrong.', 'bot');
      setOffline();
    }
  } catch {
    document.getElementById('typing')?.remove();
    addMessage('Something went wrong. Try again!', 'bot');
    setOffline();
  }

  sendBtn.disabled = false;
  input.focus();
}
  </script>
</body>
</html>
